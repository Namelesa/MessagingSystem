services:
  postgres:
    image: postgres:latest
    container_name: user_db
    restart: always
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5556:5432"
  
  postgres1:
    image: postgres:latest
    container_name: privateMessage_db
    restart: always
    environment:
      POSTGRES_DB: message
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5557:5432"
  
  postgres2:
    image: postgres:latest
    container_name: groupMessage_db
    restart: always
    environment:
      POSTGRES_DB: groupMessages
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5558:5432"
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
    ports:
      - "5672:5672"
      - "15672:15672"
  
  redis:
    image: redis:latest
    container_name: cashService
    restart: always
    ports:
      - "6650:6379"
  
  redisForMapping:
    image: redis:latest
    container_name: redis_mapping
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: [ "redis-server", "--appendonly", "yes" ]