<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Account Deleted</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #111111;
        }

        .email-container {
            max-width: 540px;
            margin: 0 auto;
            padding: 60px 30px;
            border: 1px solid #eaeaea;
            border-radius: 16px;
            background: #fdfdfd;
        }

        .headline {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
        }

        .greeting {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            text-align: center;
        }

        .text {
            font-size: 16px;
            line-height: 1.6;
            color: #222;
            text-align: center;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .footer {
            font-size: 12px;
            text-align: center;
            color: #aaaaaa;
        }

        @media (max-width: 600px) {
            .email-container {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="headline">Your Account Has Been Deleted</div>

    <div class="greeting">Hi, <strong>{UserName}</strong> 👋</div>

    <div class="text">
        This is a confirmation that your account has been successfully deleted as per your request.
        <br><br>
        We're sorry to see you go — if you ever decide to come back, you’re always welcome!
    </div>

    <div class="footer">
        © 2025 WhisperNet Inc. — All rights reserved.
    </div>
</div>
</body>
</html>
