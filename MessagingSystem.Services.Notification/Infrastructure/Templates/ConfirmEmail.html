<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm Your Email</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #111111;
        }

        .email-container {
            max-width: 540px;
            margin: 0 auto;
            padding: 60px 30px;
            border: 1px solid #eaeaea;
            border-radius: 16px;
            background: #fdfdfd;
        }

        .headline {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
        }

        .greeting {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            text-align: center;
        }

        .text {
            font-size: 16px;
            line-height: 1.6;
            color: #222;
            text-align: center;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .button-wrapper {
            text-align: center;
            margin-bottom: 40px;
        }

        .button {
            display: inline-block;
            background-color: #000000;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0;
            transition: background-color 0.2s ease-in-out;
        }

        .button:hover {
            background-color: #1a1a1a;
        }

        .note {
            font-size: 14px;
            color: #666666;
            text-align: center;
            margin-top: 0;
            margin-bottom: 40px;
        }

        .footer {
            font-size: 12px;
            text-align: center;
            color: #aaaaaa;
        }

        @media (max-width: 600px) {
            .email-container {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="headline">Confirm Your Email</div>

    <div class="greeting">Hi, <strong>{UserName}</strong> 👋</div>

    <div class="text">
        We’re excited to have you on board! Just one more step — click the button below to verify your email address and activate your account.
    </div>

    <div class="button-wrapper">
        <a href="{link}" class="button">Confirm Email</a>
    </div>

    <p class="note">
        Did not sign up? No worries — just ignore this email.
    </p>

    <div class="footer">
        © 2025 WhisperNet Inc. — All rights reserved.
    </div>
</div>
</body>
</html>
