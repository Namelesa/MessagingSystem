<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Private Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 240px;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .chat-button {
            background: none;
            border: none;
            text-align: left;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .chat-button:hover {
            background-color: #f3f4f6;
        }
        .chat-button.active {
            background-color: #e0f2fe;
            font-weight: 600;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .chat-box {
            flex: 1;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffff;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            position: relative;
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            background: #f3f4f6;
            align-self: flex-start;
        }

        .message.self {
            background-color: #d1e7fd;
            align-self: flex-end;
        }

        .message .edit-button {
            position: absolute;
            top: 4px;
            right: 8px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: none;
            font-size: 14px;
        }

        .message.self:hover .edit-button {
            display: inline;
        }

        .input-container {
            display: none;
            margin-top: 12px;
            gap: 12px;
            flex-direction: column;
        }
        .input-container.active {
            display: flex;
        }
        .input-message {
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }
        .send-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }
        .search-controls input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 6px;
            width: 100%;
        }
        .search-controls button {
            padding: 8px;
            font-size: 14px;
            border-radius: 6px;
            width: 100%;
        }

        .timestamp {
            font-size: 12px;
            color: #6b7280;
            text-align: right;
            margin-top: 4px;
        }

        .edited-label {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 2px;
            font-style: italic;
        }

    </style>
</head>
<body>
<div class="sidebar">
    <h2>Chats</h2>

    <div class="search-controls">
        <label for="searchInput"></label><input type="text" id="searchInput" placeholder="Search user..." />
        <button onclick="searchUser()">Find User</button>
    </div>

    <div id="chatList"></div>
</div>

<div class="main">
    <div class="top-bar">
        <span id="selectedUser">Select a user to chat</span>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-container" id="inputContainer">
        <label for="messageInput"></label><input type="text" id="messageInput" class="input-message" placeholder="Type a message..." />
        <button class="send-button" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const BASE_URL = "https://localhost:7275";
    const chatList = document.getElementById("chatList");
    const selectedUser = document.getElementById("selectedUser");
    const chatBox = document.getElementById("chatBox");
    const inputContainer = document.getElementById("inputContainer");
    const messageInput = document.getElementById("messageInput");

    let currentUserName = null;
    let activeChatUser = null;

    let editingMessageId = null;
    let editingMessageDiv = null;

    const connection = new signalR.HubConnectionBuilder()
        .withUrl(`${BASE_URL}/chatHub`, { withCredentials: true })
        .withAutomaticReconnect([0, 2000, 5000])
        .configureLogging(signalR.LogLevel.Information)
        .build();

    async function fetchCurrentUser() {
        try {
            const response = await fetch(`${BASE_URL}/api/messaging/me`, {
                credentials: "include",
                headers: { "Accept": "application/json" }
            });
            if (response.ok) {
                const data = await response.json();
                currentUserName = data.nick;
                return true;
            } else {
                throw new Error("Unauthorized");
            }
        } catch (err) {
            alert("Authentication required");
            return false;
        }
    }

    connection.on("ReceivePrivateMessage", ({ messageId, sender, content }) => {
        if (sender === activeChatUser || sender === currentUserName) {
            addOrUpdateMessage(messageId, sender, content, sender === currentUserName);
        }
    });

    connection.on("MessageEdited", ({ messageId, newContent }) => {
        const messageDiv = document.querySelector(`.message[data-message-id="${messageId}"]`);
        if (messageDiv) {
            const contentSpan = messageDiv.querySelector(".content");
            if (contentSpan) {
                contentSpan.textContent = newContent;
            }

            let editedLabel = messageDiv.querySelector(".edited-label");
            const now = new Date().toLocaleString();

            if (!editedLabel) {
                editedLabel = document.createElement("div");
                editedLabel.className = "edited-label";
                messageDiv.appendChild(editedLabel);
            }

            editedLabel.textContent = `edited ${now}`;
        }
    });

    function setActiveChat(user) {
        activeChatUser = user;
        selectedUser.innerText = `Chatting with: ${user}`;
        inputContainer.classList.add("active");
        chatBox.innerHTML = "";
        loadChatHistory(user);
    }

    function addOrUpdateMessage(messageId, sender, content, isSelf, sentAt = new Date(), editedAt = null) {
        let existing = document.querySelector(`.message[data-message-id="${messageId}"]`);
        if (existing) return; // avoid duplicates

        const messageDiv = document.createElement("div");
        messageDiv.classList.add("message");
        if (isSelf) messageDiv.classList.add("self");
        messageDiv.dataset.messageId = messageId;

        const contentSpan = document.createElement("span");
        contentSpan.className = "content";
        contentSpan.textContent = content;
        messageDiv.appendChild(contentSpan);

        // Время отправки
        const timestamp = document.createElement("div");
        timestamp.className = "timestamp";
        const timeStr = new Date(sentAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        timestamp.textContent = timeStr;
        messageDiv.appendChild(timestamp);

        // Если есть дата редактирования — добавим ее
        if (editedAt) {
            const editedLabel = document.createElement("div");
            editedLabel.className = "edited-label";
            const editTime = new Date(editedAt).toLocaleString();
            editedLabel.textContent = `edited ${editTime}`;
            messageDiv.appendChild(editedLabel);
        }

        if (isSelf) {
            const editBtn = document.createElement("button");
            editBtn.className = "edit-button";
            editBtn.textContent = "✏️";
            editBtn.onclick = () => {
                messageInput.value = content;
                editingMessageId = messageId;
                editingMessageDiv = contentSpan;
                messageInput.focus();
            };
            messageDiv.appendChild(editBtn);
        }

        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }


    function sendMessage() {
        const message = messageInput.value.trim();
        if (!message || !activeChatUser) return;

        if (editingMessageId && editingMessageDiv) {
            connection.invoke("EditMessageAsync", editingMessageId, message)
                .then(() => {
                    editingMessageId = null;
                    editingMessageDiv = null;
                    messageInput.value = "";
                })
                .catch(err => alert("Error editing message: " + err.message));
        } else {
            connection.invoke("SendPrivateMessage", activeChatUser, message)
                .then(() => {
                    messageInput.value = "";
                })
                .catch(err => alert("Error sending message: " + err.message));
        }
    }

    async function fetchChats() {
        try {
            const chats = await connection.invoke('GetChatsAsync');
            chatList.innerHTML = "";
            chats.forEach(chat => {
                const chatButton = document.createElement("button");
                chatButton.classList.add("chat-button");
                chatButton.innerText = chat;
                chatButton.onclick = () => {
                    document.querySelectorAll(".chat-button").forEach(b => b.classList.remove("active"));
                    chatButton.classList.add("active");
                    setActiveChat(chat);
                };
                chatList.appendChild(chatButton);
            });
        } catch (error) {
            console.error("Error fetching chats:", error);
        }
    }

    async function loadChatHistory(user) {
        try {
            const history = await connection.invoke("LoadPrivateChatHistory", user, 50);
            chatBox.innerHTML = "";

            history.forEach(({ messageId, sender, content, sentAt, editedAt }) => {
                const isSelf = sender === currentUserName;
                addOrUpdateMessage(messageId, sender, content, isSelf, sentAt, editedAt);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            console.error("Failed to load chat history:", error);
            alert("Could not load chat history.");
        }
    }


    async function searchUser() {
        const nickName = document.getElementById("searchInput").value.trim();
        if (!nickName) return;
        if (nickName === currentUserName) {
            alert("You cannot chat with yourself.");
            return;
        }

        try {
            const response = await fetch(`${BASE_URL}/api/messaging/find-user?nickName=${encodeURIComponent(nickName)}`, {
                credentials: "include",
                headers: { "Accept": "application/json" }
            });

            if (response.ok) {
                const userNick = await response.text();
                if (!userNick) {
                    alert("Empty user received from server.");
                    return;
                }

                if (!Array.from(chatList.children).some(btn => btn.innerText === userNick)) {
                    const chatButton = document.createElement("button");
                    chatButton.classList.add("chat-button");
                    chatButton.innerText = userNick;
                    chatButton.onclick = () => {
                        document.querySelectorAll(".chat-button").forEach(b => b.classList.remove("active"));
                        chatButton.classList.add("active");
                        setActiveChat(userNick);
                    };
                    chatList.appendChild(chatButton);
                }

                setActiveChat(userNick);
            } else if (response.status === 404) {
                alert("User not found");
            } else {
                alert("Unexpected error: " + response.statusText);
            }
        } catch (err) {
            console.error("Search failed:", err);
            alert("Failed to search user.");
        }
    }

    async function startConnection() {
        try {
            await connection.start();
            console.log("Connected to SignalR hub");
            await fetchChats();
        } catch (err) {
            console.error("Connection failed", err);
            setTimeout(startConnection, 3000);
        }
    }

    window.addEventListener("load", async () => {
        const authenticated = await fetchCurrentUser();
        if (authenticated) {
            await startConnection();
        }
    });
</script>
</body>
</html>
