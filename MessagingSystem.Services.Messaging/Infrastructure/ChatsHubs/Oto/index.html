<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Chat Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .section h3 {
            margin-top: 0;
        }

        input, button, select {
            padding: 8px;
            margin: 5px;
        }

        #messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            background: #f9f9f9;
        }

        .message {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #007bff;
            background: white;
            position: relative;
        }

        .message-actions {
            position: absolute;
            top: 5px;
            right: 5px;
            display: none;
        }

        .message:hover .message-actions {
            display: block;
        }

        .message-actions button {
            padding: 2px 6px;
            margin: 0 2px;
            font-size: 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .edit-btn {
            background: #ffc107;
            color: #000;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .status {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .flex {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .message-id {
            font-size: 11px;
            color: #666;
            font-family: monospace;
        }
    </style>
</head>
<body>
<h1>Simple Chat Hub Test</h1>

<!-- Connection Status -->
<div class="section">
    <h3>Connection</h3>
    <div id="connectionStatus" class="error">Disconnected</div>
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
</div>

<!-- Send Message -->
<div class="section">
    <h3>Send Message</h3>
    <div class="flex">
        <input type="text" id="recipient" placeholder="Recipient nickname" style="width: 200px;">
        <input type="text" id="messageText" placeholder="Message" style="width: 300px;">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<!-- Reply to Message -->
<div class="section">
    <h3>Reply to Message</h3>
    <div class="flex">
        <input type="text" id="replyRecipient" placeholder="Recipient" style="width: 150px;">
        <input type="text" id="replyText" placeholder="Reply message" style="width: 200px;">
        <input type="text" id="replyToId" placeholder="Reply to message ID (GUID)" style="width: 250px;">
        <button onclick="replyMessage()">Reply</button>
    </div>
</div>

<!-- Edit Message -->
<div class="section">
    <h3>Edit Message</h3>
    <div class="flex">
        <input type="text" id="editMessageId" placeholder="Message ID to edit" style="width: 250px;" readonly>
        <input type="text" id="editContent" placeholder="New content" style="width: 200px;">
        <button onclick="editMessage()">Edit</button>
        <button onclick="clearEditForm()" style="background: #6c757d; color: white;">Clear</button>
    </div>
</div>

<!-- Delete Message -->
<div class="section">
    <h3>Delete Message</h3>
    <div class="flex">
        <input type="text" id="deleteMessageId" placeholder="Message ID to delete" style="width: 250px;" readonly>
        <select id="deleteType">
            <option value="soft">Soft Delete</option>
            <option value="hard">Hard Delete</option>
        </select>
        <button onclick="deleteMessage()">Delete</button>
        <button onclick="clearDeleteForm()" style="background: #6c757d; color: white;">Clear</button>
    </div>
</div>

<!-- Find Messages -->
<div class="section">
    <h3>Find Messages</h3>
    <div class="flex">
        <input type="text" id="findRecipient" placeholder="Recipient (optional)" style="width: 150px;">
        <input type="datetime-local" id="findTime" placeholder="Time (optional)" style="width: 200px;">
        <input type="text" id="findSender" placeholder="Sender (optional)" style="width: 150px;">
        <button onclick="findMessages()">Find</button>
    </div>
</div>

<!-- Load Chat History -->
<div class="section">
    <h3>Load Chat History</h3>
    <div class="flex">
        <input type="text" id="historyUser" placeholder="User nickname" style="width: 200px;">
        <input type="number" id="historyCount" placeholder="Count" value="50" style="width: 80px;">
        <input type="number" id="historySkip" placeholder="Skip count (default 0)">
        <button onclick="loadHistory()">Load</button>
    </div>
</div>

<!-- Get Chats -->
<div class="section">
    <h3>Get Chats</h3>
    <button onclick="getChats()">Get All Chats</button>
</div>

<!-- Messages Display -->
<div class="section">
    <h3>Messages & Events</h3>
    <div id="messages"></div>
    <button onclick="clearMessages()">Clear</button>
</div>

<script>
    const BASE_URL = "https://localhost:7275";
    let connection = null;

    function addMessage(text, type = 'info', messageData = null) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message';

        const timestamp = new Date().toLocaleTimeString();
        let messageContent = `<strong>[${timestamp}]</strong> ${text}`;

        if (messageData && messageData.messageId) {
            messageContent += `
                <div class="message-id">ID: ${messageData.messageId}</div>
                <div class="message-actions">
                    <button class="edit-btn" onclick="selectForEdit('${messageData.messageId}', '${messageData.content || ''}')">Edit</button>
                    <button class="delete-btn" onclick="selectForDelete('${messageData.messageId}')">Delete</button>
                </div>
            `;
        }

        messageDiv.innerHTML = messageContent;

        if (type === 'error') {
            messageDiv.style.borderLeftColor = 'red';
        } else if (type === 'success') {
            messageDiv.style.borderLeftColor = 'green';
        }

        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function selectForEdit(messageId, currentContent) {
        document.getElementById('editMessageId').value = messageId;
        document.getElementById('editContent').value = currentContent.replace(/&quot;/g, '"');
        document.getElementById('editContent').focus();
        addMessage(`📝 Selected message ${messageId} for editing`, 'info');
    }

    function selectForDelete(messageId) {
        document.getElementById('deleteMessageId').value = messageId;
        addMessage(`🗑️ Selected message ${messageId} for deletion`, 'info');
    }

    function clearEditForm() {
        document.getElementById('editMessageId').value = '';
        document.getElementById('editContent').value = '';
    }

    function clearDeleteForm() {
        document.getElementById('deleteMessageId').value = '';
    }

    function updateConnectionStatus(status, isConnected) {
        const statusDiv = document.getElementById('connectionStatus');
        statusDiv.textContent = status;
        statusDiv.className = isConnected ? 'status' : 'error';
    }

    async function connect() {
        try {
            if (connection) {
                await connection.stop();
            }

            connection = new signalR.HubConnectionBuilder()
                .withUrl(`${BASE_URL}/otoChatHub`, { withCredentials: true })
                .withAutomaticReconnect([0, 2000, 5000])
                .configureLogging(signalR.LogLevel.Information)
                .build();

            // Event handlers
            connection.on("ReceivePrivateMessage", (message) => {
                addMessage(`📨 Message received: ${JSON.stringify(message, null, 2)}`, 'success', message);
            });

            connection.on("MessageEdited", (editInfo) => {
                addMessage(`✏️ Message edited: ${JSON.stringify(editInfo, null, 2)}`, 'success');
            });

            connection.on("MessageDeleted", (deleteInfo) => {
                addMessage(`🗑️ Message deleted: ${JSON.stringify(deleteInfo, null, 2)}`, 'success');
            });

            connection.onreconnecting(() => {
                updateConnectionStatus("Reconnecting...", false);
                addMessage("🔄 Connection lost, reconnecting...", 'error');
            });

            connection.onreconnected(() => {
                updateConnectionStatus("Connected", true);
                addMessage("✅ Reconnected successfully", 'success');
            });

            connection.onclose(() => {
                updateConnectionStatus("Disconnected", false);
                addMessage("❌ Connection closed", 'error');
            });

            await connection.start();
            updateConnectionStatus("Connected", true);
            addMessage("✅ Connected to hub successfully", 'success');

        } catch (error) {
            updateConnectionStatus("Connection Failed", false);
            addMessage(`❌ Connection failed: ${error.message}`, 'error');
        }
    }

    async function disconnect() {
        if (connection) {
            try {
                await connection.stop();
                updateConnectionStatus("Disconnected", false);
                addMessage("🔌 Disconnected from hub", 'info');
            } catch (error) {
                addMessage(`❌ Error disconnecting: ${error.message}`, 'error');
            }
        }
    }

    async function sendMessage() {
        if (!connection) {
            addMessage("❌ Not connected to hub", 'error');
            return;
        }

        const recipient = document.getElementById('recipient').value.trim();
        const message = document.getElementById('messageText').value.trim();

        if (!recipient || !message) {
            addMessage("❌ Please fill recipient and message", 'error');
            return;
        }

        try {
            const result = await connection.invoke("SendMessageAsync", recipient, message);
            addMessage(`✅ Message sent: ${JSON.stringify(result, null, 2)}`, 'success', result);
            document.getElementById('messageText').value = '';
        } catch (error) {
            addMessage(`❌ Send failed: ${error.message}`, 'error');
        }
    }

    async function replyMessage() {
        if (!connection) {
            addMessage("❌ Not connected to hub", 'error');
            return;
        }

        const recipient = document.getElementById('replyRecipient').value.trim();
        const message = document.getElementById('replyText').value.trim();
        const replyToId = document.getElementById('replyToId').value.trim();

        if (!recipient || !message || !replyToId) {
            addMessage("❌ Please fill all reply fields", 'error');
            return;
        }

        try {
            const result = await connection.invoke("ReplyToMessageAsync", recipient, message, replyToId);
            addMessage(`✅ Reply sent: ${JSON.stringify(result, null, 2)}`, 'success', result);
            document.getElementById('replyText').value = '';
        } catch (error) {
            addMessage(`❌ Reply failed: ${error.message}`, 'error');
        }
    }

    async function editMessage() {
        if (!connection) {
            addMessage("❌ Not connected to hub", 'error');
            return;
        }

        const messageId = document.getElementById('editMessageId').value.trim();
        const content = document.getElementById('editContent').value.trim();

        if (!messageId || !content) {
            addMessage("❌ Please fill message ID and new content", 'error');
            return;
        }

        try {
            await connection.invoke("EditMessageAsync", messageId, content);
            addMessage(`✅ Message edited successfully`, 'success');
            clearEditForm();
        } catch (error) {
            addMessage(`❌ Edit failed: ${error.message}`, 'error');
        }
    }

    async function deleteMessage() {
        if (!connection) {
            addMessage("❌ Not connected to hub", 'error');
            return;
        }

        const messageId = document.getElementById('deleteMessageId').value.trim();
        const deleteType = document.getElementById('deleteType').value;

        if (!messageId) {
            addMessage("❌ Please provide message ID", 'error');
            return;
        }

        try {
            await connection.invoke("DeleteMessageAsync", messageId, deleteType);
            addMessage(`✅ Message deleted (${deleteType})`, 'success');
            clearDeleteForm();
        } catch (error) {
            addMessage(`❌ Delete failed: ${error.message}`, 'error');
        }
    }

    async function findMessages() {
        if (!connection) {
            addMessage("❌ Not connected to hub", 'error');
            return;
        }

        const recipient = document.getElementById('findRecipient').value.trim() || null;
        const timeStr = document.getElementById('findTime').value.trim();
        const sender = document.getElementById('findSender').value.trim() || null;

        const time = timeStr ? new Date(timeStr).toISOString() : null;

        try {
            const result = await connection.invoke("FindMessagesAsync", recipient, time, sender);
            if (result && result.length > 0) {
                addMessage(`🔍 Found ${result.length} messages: ${JSON.stringify(result, null, 2)}`, 'success');
                result.forEach(msg => {
                    addMessage(`📋 Found message from ${msg.sender}: "${msg.content}"`, 'info', msg);
                });
            } else {
                addMessage(`🔍 No messages found with specified criteria`, 'info');
            }
        } catch (error) {
            addMessage(`❌ Find messages failed: ${error.message}`, 'error');
        }
    }

    async function loadHistory() {
        if (!connection) {
            addMessage("❌ Not connected to hub", 'error');
            return;
        }

        const user = document.getElementById('historyUser').value.trim();
        const count = parseInt(document.getElementById('historyCount').value) || 50;
        const skip = parseInt(document.getElementById('historySkip').value) || 0;
        
        if (!user) {
            addMessage("❌ Please provide user nickname", 'error');
            return;
        }

        try {
            const result = await connection.invoke("LoadChatHistoryAsync", user, count, skip);
            addMessage(`✅ Chat history loaded (${result.length} messages): ${JSON.stringify(result, null, 2)}`, 'success');
            result.forEach(msg => {
                addMessage(`📜 History message from ${msg.sender}: "${msg.content}"`, 'info', msg);
            });
        } catch (error) {
            addMessage(`❌ Load history failed: ${error.message}`, 'error');
        }
    }

    async function getChats() {
        if (!connection) {
            addMessage("❌ Not connected to hub", 'error');
            return;
        }

        try {
            const result = await connection.invoke("GetChatsAsync");
            addMessage(`✅ Chats loaded: ${JSON.stringify(result, null, 2)}`, 'success');
        } catch (error) {
            addMessage(`❌ Get chats failed: ${error.message}`, 'error');
        }
    }

    function clearMessages() {
        document.getElementById('messages').innerHTML = '';
    }

    // Auto-connect on page load
    window.addEventListener('load', () => {
        addMessage("🚀 Page loaded. Click 'Connect' to start testing", 'info');
    });

    // Handle Enter key in input fields
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const activeElement = document.activeElement;
            if (activeElement.id === 'messageText') {
                sendMessage();
            } else if (activeElement.id === 'replyText') {
                replyMessage();
            } else if (activeElement.id === 'editContent') {
                editMessage();
            }
        }
    });
</script>
</body>
</html>
